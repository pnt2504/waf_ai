<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 – Blocked by WAF</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 52px 44px;
      max-width: 540px;
      width: 92%;
      text-align: center;
    }

    .shield {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 20px;
    }

    h1 {
      color: #ef4444;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    h2 {
      color: #f87171;
      font-size: 1.05rem;
      font-weight: 400;
      margin-bottom: 28px;
    }

    .divider {
      border: none;
      border-top: 1px solid #334155;
      margin: 24px 0;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.88rem;
    }

    .info-label { color: #64748b; }
    .info-value { color: #94a3b8; font-family: monospace; }
    .badge-attack {
      background: #7f1d1d;
      color: #fca5a5;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-prob {
      background: #1c1917;
      color: #fb923c;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-family: monospace;
    }

    .note {
      margin-top: 24px;
      color: #475569;
      font-size: 0.82rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="shield">🛡️</span>
    <h1>403 – Access Denied</h1>
    <h2>Yêu cầu của bạn đã bị WAF phát hiện và chặn</h2>

    <hr class="divider">

    <div class="info-row">
      <span class="info-label">Verdict</span>
      <span class="badge-attack">ATTACK</span>
    </div>
    <div class="info-row">
      <span class="info-label">Xác suất tấn công</span>
      <span class="badge-prob" id="prob">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Request ID</span>
      <span class="info-value" id="rid">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Thời gian</span>
      <span class="info-value" id="ts">—</span>
    </div>

    <hr class="divider">

    <p class="note">
      Nếu bạn cho rằng đây là cảnh báo nhầm (false positive), hãy liên hệ
      quản trị viên kèm theo Request ID ở trên.
    </p>
  </div>

  <script>
    // Điền thông tin từ data attribute (được inject bởi server nếu dùng template)
    const el = (id) => document.getElementById(id);
    const params = new URLSearchParams(window.location.search);

    const prob = params.get("prob") || "—";
    const rid  = params.get("rid")  || "—";

    el("prob").textContent = prob !== "—" ? parseFloat(prob).toFixed(4) : "—";
    el("rid").textContent  = rid;
    el("ts").textContent   = new Date().toLocaleString("vi-VN");
  </script>
</body>
</html>

# =============================================================================
# nginx/waf.conf — Nginx tích hợp ML WAF qua auth_request
#
# Luồng mỗi request:
#   1. Client gửi request → Nginx port 80
#   2. Nginx gửi subrequest nội bộ → /waf-check → WAF server :8000/auth
#   3. WAF chạy RandomForest, trả 200 (NORMAL) hoặc 403 (ATTACK)
#   4. 200 → Nginx proxy tiếp đến backend
#      403 → Nginx trả JSON blocked về client
# =============================================================================

upstream waf_server  { server waf:8000;     keepalive 32; }
upstream app_backend { server backend:5000; keepalive 16; }

log_format waf_combined '$remote_addr [$time_local] "$request" $status '
                        'waf="$waf_verdict" prob="$waf_prob" rid="$waf_rid" '
                        'rt=${request_time}s';

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/waf_access.log waf_combined;
    error_log  /var/log/nginx/waf_error.log  warn;

    client_max_body_size 10m;

    # ── Internal: subrequest đến WAF ──────────────────────────────────────────
    location = /waf-check {
        internal;
        proxy_pass http://waf_server/auth;
        proxy_pass_request_body  on;
        proxy_set_header X-Original-URI      $request_uri;
        proxy_set_header X-Original-Method   $request_method;
        proxy_set_header X-Original-IP       $remote_addr;
        proxy_set_header X-Original-UA       $http_user_agent;
        proxy_set_header X-Original-Ref      $http_referer;
        proxy_set_header X-Original-Cookie   $http_cookie;
        proxy_set_header X-Original-Host     $host;
        proxy_set_header Content-Type        $content_type;
        proxy_set_header Content-Length      $content_length;
        proxy_connect_timeout 3s;
        proxy_read_timeout    5s;
    }

    # ── Root path: không có payload → bỏ qua WAF, forward thẳng ────────────────
    # Lý do: GET / với feature vector toàn 0 bị model phán là scanner probe
    # (training data CSIC không có normal GET / → model chưa học pattern này)
    location = / {
        proxy_pass http://app_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header X-WAF-Verdict "BYPASS-ROOT" always;
    }

    # ── Main: tất cả request còn lại đi qua WAF ───────────────────────────────
    location / {
        auth_request /waf-check;

        auth_request_set $waf_verdict  $upstream_http_x_waf_verdict;
        auth_request_set $waf_prob     $upstream_http_x_waf_probability;
        auth_request_set $waf_rid      $upstream_http_x_waf_request_id;

        proxy_pass http://app_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header X-WAF-Verdict     $waf_verdict always;
        add_header X-WAF-Probability $waf_prob    always;
        add_header X-WAF-Request-ID  $waf_rid     always;
    }

    # ── 403: WAF chặn ─────────────────────────────────────────────────────────
    error_page 403 = @waf_blocked;
    location @waf_blocked {
        default_type application/json;
        add_header X-WAF-Verdict     $waf_verdict always;
        add_header X-WAF-Probability $waf_prob    always;
        add_header X-WAF-Request-ID  $waf_rid     always;
        return 403 '{"blocked":true,"verdict":"ATTACK","probability":"$waf_prob","request_id":"$waf_rid"}';
    }

    # ── Fail-open: WAF server down → vẫn cho qua (đổi thành 503 nếu muốn fail-closed)
    error_page 500 502 503 504 = @waf_failopen;
    location @waf_failopen {
        proxy_pass http://app_backend;
        add_header X-WAF-Verdict "WAF-ERROR-FAILOPEN" always;
    }

    location = /nginx-health {
        access_log off;
        return 200 '{"nginx":"ok"}';
        default_type application/json;
    }
}
